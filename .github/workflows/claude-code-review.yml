name: Claude Code Review

# Review automatique de chaque PR par Claude Opus 4.7.
# Focus sécurité (IDOR, leaks, multi-tenant) + SEO + qualité code.
#
# Pré-requis : ajouter le secret ANTHROPIC_API_KEY dans Settings > Secrets
# and variables > Actions du repo.
# Récupération du token : https://console.anthropic.com/settings/keys

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Claude Opus 4.7 review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write   # Requis par claude-code-action pour OIDC token
      actions: read

    # Skip drafts and the bot's own PRs to éviter boucles infinies
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'

    steps:
      - name: Checkout
        uses: actions/checkout@v6   # v4 deprecated (Node 20) -> v6 (Node 24)
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        # Syntax officielle (vérifiée sur action.yml de anthropics/claude-code-action)
        # : anthropic_api_key en INPUT with: (pas en env), claude_args en JSON
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            {
              "model": "claude-opus-4-7"
            }
          prompt: |
            Review cette PR en français. Tu es un reviewer senior expert
            Bativio (SaaS B2B artisans Rhône-Alpes, Next.js 16 + Prisma +
            JWT cookie auth + Stripe + Cloudinary + plan-gated features).

            ## Focus PRIORITAIRE (P0)

            1. **Sécurité multi-tenant** :
               - Endpoints /api/v1/artisans/me/* filtrent par userId du JWT
               - Pas d'IDOR sur ids cuid (devis, photos, rdv, demandes)
               - Endpoints /api/v1/admin/* vérifient role === 'ADMIN'
               - Endpoints publics ne leakent pas email, plan, siret,
                 planOverride, planOverrideExpireAt

            2. **Secrets et credentials** :
               - Aucun token, JWT_SECRET, API key, DATABASE_URL dans code
               - Pas de header Authorization: Bearer côté client
                 (Bativio = cookie HttpOnly bativio-session)

            3. **Plan enforcement** :
               - getEffectivePlan(artisan) utilisé (pas artisan.plan direct)
               - hasFeature() ou requireFeature() sur endpoints premium

            ## Focus SEO (P1)

            - generateMetadata() sur pages publiques avec title+description
            - Title <60 chars, description <160 chars
            - Pas de noindex involontaire
            - Schema.org cohérent
            - Pas de régression /[ville]/[metier] (canonical, sitemap)

            ## Focus qualité code (P2)

            - TypeScript strict, pas de any non justifié
            - Server Components par défaut
            - prisma jamais dans Client Component
            - apiSuccess/apiError pour API Routes
            - authFetch() côté client

            ## Comportement

            - Si tout OK : commentaire bref "✅ LGTM" + 1 ligne par check
            - Si problème : commentaires inline précis + fix suggéré
            - Si CRITIQUE (leak, IDOR, secret) : flag "🚨 BLOQUANT"
            - Ne PAS approuver/merger automatiquement
