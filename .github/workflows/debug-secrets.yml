name: Debug Secrets

# Workflow temporaire pour vérifier si ANTHROPIC_API_KEY est bien
# configuré comme Repository Secret. À supprimer après debug.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence (ne révèle JAMAIS la valeur)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "=== Diagnostic ANTHROPIC_API_KEY ==="
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ Secret ABSENT ou vide"
            echo "  → Aller sur https://github.com/eltarik73/bativio/settings/secrets/actions"
            echo "  → Vérifier que 'ANTHROPIC_API_KEY' est dans Repository secrets (pas Environment)"
            exit 1
          else
            LENGTH=${#ANTHROPIC_API_KEY}
            PREFIX="${ANTHROPIC_API_KEY:0:10}"
            echo "✅ Secret présent"
            echo "  → Longueur : $LENGTH chars"
            echo "  → Préfixe  : ${PREFIX}..."
            if [ "$LENGTH" -lt 50 ]; then
              echo "⚠️  Longueur < 50 chars → probablement valeur incorrecte"
              exit 1
            fi
            if [ "$PREFIX" != "sk-ant-api" ]; then
              echo "⚠️  Préfixe ne commence pas par 'sk-ant-api' → mauvaise clé"
              exit 1
            fi
            echo "✅ Secret semble valide (sk-ant-api + 100+ chars)"
          fi
